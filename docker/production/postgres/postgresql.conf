# PostgreSQL Configuration for 8GB RAM / 4 cores
# Optimized for Laravel application workload

# =============================================================================
# MEMORY
# =============================================================================
# 25% of allocated ~2.5GB
shared_buffers = 640MB
# 75% of allocated memory
effective_cache_size = 1920MB
# Per-operation memory (sorts, joins); keep conservative with a higher connection ceiling
work_mem = 8MB
# For VACUUM, CREATE INDEX
maintenance_work_mem = 256MB
# Use huge pages if available
huge_pages = try

# =============================================================================
# CONNECTIONS
# =============================================================================
listen_addresses = '*'
# Covers Octane, Horizon, scheduler and the shared MadelineProto async pool.
# docker-compose.production.yml may override this value through POSTGRES_MAX_CONNECTIONS.
max_connections = 200
superuser_reserved_connections = 5

# Close abandoned transactions without terminating ordinary idle pooled connections
idle_in_transaction_session_timeout = 60s

# =============================================================================
# WAL & CHECKPOINTS
# =============================================================================
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 1GB
min_wal_size = 256MB

# =============================================================================
# QUERY PLANNER
# =============================================================================
# SSD optimization (default 4.0)
random_page_cost = 1.1
# SSD optimization (default 1)
effective_io_concurrency = 200
default_statistics_target = 100

# =============================================================================
# PARALLELISM (4 cores)
# =============================================================================
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# =============================================================================
# LOGGING
# =============================================================================
# Log destination
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# Log queries > 200ms (slow log)
log_min_duration_statement = 200

# What to log
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1000

# Log format - include useful info
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_statement = 'none'
log_duration = off

# Log query plans for slow queries (very useful for optimization)
auto_explain.log_min_duration = 500
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_nested_statements = on

# =============================================================================
# PG_STAT_STATEMENTS (for PgHero)
# =============================================================================
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# =============================================================================
# AUTOVACUUM
# =============================================================================
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
