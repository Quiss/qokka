; =============================================================================
; PHP Production Configuration for FrankenPHP + Octane
; Server: 8GB RAM, 4 cores
; =============================================================================

[PHP]
; -----------------------------------------------------------------------------
; MEMORY & LIMITS
; -----------------------------------------------------------------------------
memory_limit = 512M
max_execution_time = 120
max_input_time = 60
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 20

; -----------------------------------------------------------------------------
; ERROR HANDLING (Production)
; -----------------------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /dev/stderr

; -----------------------------------------------------------------------------
; SECURITY
; -----------------------------------------------------------------------------
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; -----------------------------------------------------------------------------
; SESSION (though Octane uses stateless approach)
; -----------------------------------------------------------------------------
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On

; -----------------------------------------------------------------------------
; REALPATH CACHE (Important for Octane - files are loaded once)
; -----------------------------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; =============================================================================
; OPCACHE (Critical for FrankenPHP/Octane performance)
; =============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; Preloading (Laravel optimization)
; opcache.preload = /var/www/html/bootstrap/preload.php
; opcache.preload_user = www-data

; =============================================================================
; EXTENSIONS CONFIGURATION
; =============================================================================

[intl]
intl.default_locale = ru_RU

[date]
date.timezone = Europe/Moscow

[mbstring]
mbstring.internal_encoding = UTF-8

; =============================================================================
; IMAGICK
; =============================================================================
[imagick]
imagick.skip_version_check = 1
