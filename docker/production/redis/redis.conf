# Redis Configuration for 8GB RAM server
# Optimized for Laravel cache + queues (Horizon)

# =============================================================================
# MEMORY
# =============================================================================
maxmemory 512mb

# Evict least recently used keys when full
maxmemory-policy allkeys-lru

# =============================================================================
# PERSISTENCE (RDB snapshots)
# =============================================================================
# Save if 1 key changed in 15 min
save 900 1
# Save if 10 keys changed in 5 min
save 300 10
# Save if 10000 keys changed in 1 min
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# =============================================================================
# APPEND ONLY FILE (more durable, good for queues)
# =============================================================================
appendonly yes
appendfilename "appendonly.aof"
# Good balance of performance/durability
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# =============================================================================
# NETWORK
# =============================================================================
tcp-keepalive 300
timeout 0
tcp-backlog 511

# =============================================================================
# PERFORMANCE
# =============================================================================
# Lazy freeing - async deletion (better latency)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# IO threads for better performance (4 cores)
io-threads 2
io-threads-do-reads yes

# =============================================================================
# MEMORY OPTIMIZATION
# =============================================================================
activerehashing yes
# Background tasks frequency
hz 10

# Hash optimization (Laravel sessions/cache often use hashes)
hash-max-listpack-entries 512
hash-max-listpack-value 64

# List optimization (Horizon queues)
list-max-listpack-size -2
list-compress-depth 1

# =============================================================================
# SLOW LOG
# =============================================================================
# Log commands > 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# =============================================================================
# SECURITY
# =============================================================================
# Disabled - using Docker network isolation
protected-mode no
