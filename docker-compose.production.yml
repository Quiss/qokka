x-app-volumes: &app-volumes
  - .:/var/www/html

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  # Main application (FrankenPHP + Octane)
  app:
    image: ${APP_IMAGE:-channelbot-app}:latest
    build:
      context: .
      dockerfile: docker/production/php/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    restart: unless-stopped
    logging: *default-logging
    init: true
    working_dir: /var/www/html
    command: ["php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=8080", "--workers=${OCTANE_WORKERS:-6}", "--max-requests=${OCTANE_MAX_REQUESTS:-1000}"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qokka.rule=Host(`${APP_DOMAIN:-qokka.ru}`) || Host(`www.${APP_DOMAIN:-qokka.ru}`)"
      - "traefik.http.routers.qokka.entrypoints=https"
      - "traefik.http.routers.qokka.tls=true"
      - "traefik.http.routers.qokka.tls.certresolver=le"
      - "traefik.http.services.qokka.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.qokka-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.qokka-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.qokka-redirect.redirectregex.permanent=true"
      - "traefik.http.middlewares.qokka-compress.compress=true"
      - "traefik.http.middlewares.qokka-compress.compress.minresponsebodybytes=512"
#      - "traefik.http.middlewares.qokka-auth.basicauth.users=${BASIC_AUTH_USERS}"
      - "traefik.http.routers.qokka.middlewares=qokka-compress,qokka-redirect"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_APPLICATION_NAME: channelbot-app
      OCTANE_SERVER: frankenphp
      OCTANE_HTTPS: "true"
      OCTANE_WORKERS: ${OCTANE_WORKERS:-6}
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-1000}
      AUTORUN_ENABLED: "true"
      PHP_OPCACHE_ENABLE: 1
      PHP_MEMORY_LIMIT: "256M"
      XDG_CONFIG_HOME: /tmp
    volumes: *app-volumes
    networks:
      - traefiknet
      - default
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduler (cron)
  scheduler:
    image: ${APP_IMAGE:-channelbot-app}:latest
    restart: unless-stopped
    logging: *default-logging
    init: true
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      DB_APPLICATION_NAME: channelbot-scheduler
    volumes: *app-volumes
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Horizon (Laravel queue manager)
  horizon:
    image: ${APP_IMAGE:-channelbot-app}:latest
    restart: unless-stopped
    logging: *default-logging
    init: true
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon", "--environment=production"]
    stop_signal: SIGTERM
    stop_grace_period: 370s
    environment:
      DB_APPLICATION_NAME: channelbot-horizon
    volumes: *app-volumes
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # TelegramApiServer is the only process that opens MadelineProto sessions.
  telegram-api:
    image: ${TELEGRAM_API_SERVER_IMAGE:-channelbot-telegram-api}:latest
    build:
      context: .
      dockerfile: docker/production/telegram-api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    init: true
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /app-host-link
    command: ["-s=*"]
    stop_signal: SIGTERM
    stop_grace_period: 120s
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 9503
      MEMORY_LIMIT: ${TELEGRAM_API_SERVER_MEMORY_LIMIT:-512M}
      TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      REQUESTS_BULK_INTERVAL: 0
      IP_WHITELIST: 127.0.0.1
      PASSWORDS: '{}'
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      LOGGER_LEVEL: ${TELEGRAM_API_SERVER_LOG_LEVEL:-2}
      TELEGRAM_PROXY_ADDRESS: ""
      TELEGRAM_PROXY_PORT: ""
      TELEGRAM_PROXY_USERNAME: ""
      TELEGRAM_PROXY_PASSWORD: ""
      DB_TYPE: postgres
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_MAX_CONNECTIONS: ${TELEGRAM_DATABASE_MAX_CONNECTIONS:-20}
      DB_IDLE_TIMEOUT: ${TELEGRAM_DATABASE_IDLE_TIMEOUT:-300}
      DB_CACHE_TTL: ${TELEGRAM_DATABASE_CACHE_TTL:-+5 minutes}
      DB_SERIALIZER: serialize
      DB_ENABLE_MIN_DATABASE: 0
      DB_ENABLE_FILE_REFERENCE_DATABASE: 1
      PROMETHEUS_ENABLE: 0
      RESUME_ON_ERROR: 0
      WAIT_HOSTS: pgsql:5432
      WAIT_TIMEOUT: 60
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp
    volumes:
      - ./storage/app/telegram-api-server/sessions:/app-host-link/sessions
    networks:
      - default
    depends_on:
      pgsql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--max-time", "15", "http://localhost:9503/system/healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s

  # Receives raw MTProto updates over TelegramApiServer WebSocket.
  telegram-events:
    image: ${APP_IMAGE:-channelbot-app}:latest
    restart: unless-stopped
    logging: *default-logging
    init: true
    working_dir: /var/www/html
    command: ["php", "artisan", "telegram:listen", "--no-interaction"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    environment:
      DB_APPLICATION_NAME: channelbot-telegram-events
    volumes: *app-volumes
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
      telegram-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]hp artisan telegram:listen' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Executes media downloads and other account-owner commands outside Horizon.
  telegram-owner:
    image: ${APP_IMAGE:-channelbot-app}:latest
    restart: unless-stopped
    logging: *default-logging
    init: true
    working_dir: /var/www/html
    command: ["php", "artisan", "telegram:owner:work", "--no-interaction"]
    stop_signal: SIGTERM
    stop_grace_period: 370s
    environment:
      DB_APPLICATION_NAME: channelbot-telegram-owner
    volumes: *app-volumes
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
      telegram-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]hp artisan telegram:owner:work' > /dev/null && php artisan telegram:api:health --no-interaction"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s

  # PostgreSQL
  pgsql:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      PGPASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - vetify-pgsql:/var/lib/postgresql/data
      - ./docker/production/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/production/postgres/init-pghero.sql:/docker-entrypoint-initdb.d/init-pghero.sql:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis
  redis:
    image: redis:alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - vetify-redis:/data
      - ./docker/production/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Mailpit (staging email catcher)
#  mailpit:
#    image: axllent/mailpit:latest
#    restart: unless-stopped
#    labels:
#      - "traefik.enable=true"
#      - "traefik.http.routers.mailpit.rule=Host(`mailpit.${APP_DOMAIN:-qokka.ru}`)"
#      - "traefik.http.routers.mailpit.entrypoints=https"
#      - "traefik.http.routers.mailpit.tls=true"
#      - "traefik.http.routers.mailpit.tls.certresolver=le"
#      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
#      - "traefik.http.routers.mailpit.middlewares=qokka-auth"
#    networks:
#      - traefiknet
#      - default

networks:
  traefiknet:
    external: true
  default:
    driver: bridge

volumes:
  vetify-pgsql:
    driver: local
  vetify-redis:
    driver: local
